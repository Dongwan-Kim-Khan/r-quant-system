name: Daily Al-Sangmoo Quant Briefing & Forward Tracker

on:
  schedule:
    # Runs at 03:30 UTC every Monday-Friday (12:30 KST Lunchtime)
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-daily-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Al-Sangmoo Daily Bot & Forward Tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER || secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || secrets.EMAIL_PASSWORD }}
          ALERT_EMAIL_RECEIVER: ${{ secrets.ALERT_EMAIL_RECEIVER || secrets.EMAIL_RECEIVER }}
        run: |
          python al_sangmoo_daily_bot.py

      - name: Commit and Push Updated Forward Tracking History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_history.csv daily_reports/
          git commit -m "chore: auto-update forward trade history & daily briefing [skip ci]" || echo "No changes to commit"
          git push
