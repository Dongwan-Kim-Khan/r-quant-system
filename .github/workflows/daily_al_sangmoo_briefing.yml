name: Daily Al-Sangmoo Quant Briefing & Forward Tracker

on:
  schedule:
    # Runs at 23:30 UTC every Sunday-Thursday (08:30 KST Monday-Friday)
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-daily-quant:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run Al-Sangmoo Daily Bot & Forward Tracker
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python al_sangmoo_daily_bot.py

      - name: Commit and Push Updated Forward Tracking History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trade_history.csv daily_reports/
          git commit -m "chore: auto-update forward trade history & daily briefing [skip ci]" || echo "No changes to commit"
          git push
